<svg width="1920" height="800" viewBox="0 0 1920 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5530;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a7c59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b8e23;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Certificate pattern -->
    <pattern id="certificatePattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none"/>
      <g opacity="0.1">
        <!-- Certificate outline -->
        <rect x="50" y="60" width="100" height="80" fill="none" stroke="#ffd700" stroke-width="2" rx="5"/>
        <circle cx="100" cy="100" r="15" fill="none" stroke="#ffd700" stroke-width="2"/>
        <path d="M85 100 L95 110 L115 90" stroke="#ffd700" stroke-width="2" fill="none"/>
      </g>
    </pattern>
    
    <!-- Award pattern -->
    <pattern id="awardPattern" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="none"/>
      <g opacity="0.08">
        <!-- Trophy shape -->
        <path d="M70 60 Q70 50 80 50 L100 50 Q110 50 110 60 L110 80 Q110 90 100 90 L80 90 Q70 90 70 80 Z" fill="#ffd700"/>
        <rect x="85" y="90" width="10" height="20" fill="#ffd700"/>
        <ellipse cx="90" cy="115" rx="15" ry="5" fill="#ffd700"/>
      </g>
    </pattern>
    
    <!-- Palm leaf pattern -->
    <pattern id="palmPattern" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="none"/>
      <g opacity="0.06">
        <path d="M75 30 Q85 50 75 70 Q65 50 75 30" fill="#90EE90"/>
        <path d="M75 70 Q85 90 75 110 Q65 90 75 70" fill="#90EE90"/>
        <line x1="75" y1="30" x2="75" y2="110" stroke="#90EE90" stroke-width="2"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="1920" height="800" fill="url(#mainGradient)"/>
  
  <!-- Overlay patterns -->
  <rect width="1920" height="800" fill="url(#certificatePattern)"/>
  <rect width="1920" height="800" fill="url(#awardPattern)"/>
  <rect width="1920" height="800" fill="url(#palmPattern)"/>
  
  <!-- Decorative elements -->
  <g opacity="0.15">
    <!-- Large certificate in background -->
    <rect x="100" y="100" width="300" height="200" fill="none" stroke="#ffd700" stroke-width="3" rx="10"/>
    <circle cx="250" cy="200" r="40" fill="none" stroke="#ffd700" stroke-width="3"/>
    <path d="M210 200 L230 220 L290 160" stroke="#ffd700" stroke-width="4" fill="none"/>
    
    <!-- Award ribbon -->
    <path d="M1500 150 Q1520 130 1540 150 L1540 250 Q1520 270 1500 250 Z" fill="#ffd700" opacity="0.2"/>
    <path d="M1540 150 Q1560 130 1580 150 L1580 250 Q1560 270 1540 250 Z" fill="#daa520" opacity="0.2"/>
    
    <!-- Floating certificates -->
    <g transform="rotate(15 400 500)">
      <rect x="350" y="450" width="100" height="70" fill="none" stroke="#ffd700" stroke-width="2" rx="5"/>
      <circle cx="400" cy="485" r="12" fill="none" stroke="#ffd700" stroke-width="2"/>
    </g>
    
    <g transform="rotate(-10 1300 600)">
      <rect x="1250" y="550" width="100" height="70" fill="none" stroke="#90EE90" stroke-width="2" rx="5"/>
      <circle cx="1300" cy="585" r="12" fill="none" stroke="#90EE90" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Subtle overlay for text readability -->
  <rect width="1920" height="800" fill="rgba(44, 85, 48, 0.3)"/>
  
  <!-- Golden accent overlay -->
  <rect width="1920" height="800" fill="url(#goldGradient)"/>
</svg>